<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Persona Wire 管理画面</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#dashboard">
        <strong>Persona Wire</strong>
        <small>NEWS × SNS CURATION</small>
      </a>

      <nav class="nav">
        <div class="nav-group">運用</div>
        <a href="#dashboard" data-route="dashboard">ダッシュボード</a>
        <a href="#inbox" data-route="inbox">収集・AI判定<span class="nav-badge" id="badge-inbox"></span></a>
        <a href="#delivery" data-route="delivery">有料配信</a>

        <div class="nav-group">設定</div>
        <a href="#personas" data-route="personas">ペルソナ</a>
        <a href="#products" data-route="products">商品・リンク</a>
        <a href="#notion" data-route="notion">Notion連携</a>

        <div class="nav-group">確認</div>
        <a href="#site" data-route="site">公開サイト</a>
      </nav>

      <div class="sync-status" id="sync-status"></div>
    </aside>

    <div class="sidebar-scrim" id="scrim"></div>

    <main class="main">
      <div class="mobile-bar">
        <button class="icon-btn" id="menu-btn" aria-label="メニュー">☰</button>
        <strong>Persona Wire</strong>
      </div>
      <div id="view"></div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toasts" class="toasts"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
